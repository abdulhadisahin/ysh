[project]
name = "ysh-repository"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
]

[tool.pytest.ini_options]
testpaths = ["YSH/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
pythonpath = ["YSH"]
